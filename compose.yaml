# Default deployment: bridge network with port 7001 published to the host.
# Suitable for: bare docker-compose, aaPanel + Docker manager, custom reverse
# proxies (nginx, Caddy on host, Cloudflare Tunnel, etc.) that talk to
# 127.0.0.1:7001 on the host.
#
# For 1Panel users: use compose.1panel.sample.yaml so the container can reach
# the 1Panel-managed MySQL/Redis on the 1panel-network.
#
# For aaPanel native (openresty on host) users that prefer host networking:
# use compose.host.sample.yaml.
#
# ======================================================================
# Xboard + OlcRTC Integration — One-Click docker-compose
# Автоматически поднимает: Xboard (PHP/Laravel) + olcrtc-manager (Go)
# Установка на VPS:
#   1. git clone https://github.com/vsvavan2/Xboard /opt/xboard && cd /opt/xboard
#   2. cp .env.example .env  (и при желании отредактируйте)
#   3. docker compose run -it --rm xboard php artisan xboard:install
#   4. docker compose up -d
# ======================================================================

services:
  # ============================================================
  # 1. Xboard — веб + бэкенд + Horizon + WebSocket + Caddy
  # ============================================================
  xboard:
    image: ghcr.io/vsvavan2/xboard:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CACHEBUST: ${CACHEBUST:-1}
    container_name: xboard-web
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      olcrtc-manager:
        condition: service_healthy
    ports:
      - "80:7001"
      - "${XBOARD_PORT:-7001}:7001"
    volumes:
      - ./.env:/www/.env
      - ./.docker/.data/:/www/.docker/.data
      - ./storage/logs:/www/storage/logs
      - ./storage/theme:/www/storage/theme
      - ./plugins:/www/plugins
      - ./plugins-core:/www/plugins-core:ro
      - ./theme:/www/theme:ro
      # ====================================================================
      # Persistent admin SPA (optional but highly recommended).
      # The container entrypoint auto-materialises the React admin build
      # (from cedar2025/xboard-admin-dist) on every start when the folder
      # is missing.  Mount this volume to avoid the tiny git-clone cost
      # after every `docker compose up -d` and to keep your own build if
      # you ever replace the dist.  Run once on the host to seed it:
      #   mkdir -p ./_persistent_public/assets
      #   git clone --depth=1 https://github.com/cedar2025/xboard-admin-dist \
      #       ./_persistent_public/assets/admin
      # ====================================================================
      # - ./_persistent_public/assets/admin:/www/public/assets/admin:ro
    environment:
      - RESOURCE_PROFILE=balanced        # minimal | balanced | performance | auto
      - ENABLE_HORIZON=true
      - AUTO_INSTALL=1                   # Авто-установка при первом старте (если INSTALLED=1 нет в .env / таблиц v2_system_config нет в БД)
      - docker=true
      - ADMIN_SPA_OLCRTC_ONLY_PATCH=${ADMIN_SPA_OLCRTC_ONLY_PATCH:-1}  # Скрывает меню Server/Node/Clash/Subscribe в админке+ЛК. 0=отключить.
      # Override the admin-SPA source git URL used by the auto-materialiser
      # inside the entrypoint (e.g. for your own fork or air-gapped mirror):
      # - ADMIN_DIST_REPO=https://github.com/your-fork/xboard-admin-dist.git
      # ----- OlcRTC plugin defaults (перебиваются в админке плагина) -----
      - OLCRMGR_URL=http://olcrtc-manager:8080
      - OLCRMGR_API_KEY=${OLCRMGR_API_KEY:-please-change-me-in-env-file}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null --max-time 5 http://127.0.0.1:7001/ --resolve 127.0.0.1:7001:127.0.0.1 || ( php -r 'function_exists(\"opcache_reset\") && opcache_reset();' && curl -fsS -o /dev/null --max-time 5 http://127.0.0.1:7002/ )"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 45s
    networks:
      - xboard-net

  # ============================================================
  # 2. olcrtc-manager — REST API + супервизор VPN-инстансов
  # ============================================================
  olcrtc-manager:
    image: ghcr.io/vsvavan2/xboard-olcrtc-manager:latest
    build:
      context: .
      dockerfile: olcrtc-manager.Dockerfile
      args:
        OLCRTC_RELEASE: ${OLCRTC_RELEASE:-master}
        # SHA коммита апстрима; инвалидирует кэш сборки ядра olcrtc.
        # Заполняется автоматически скриптом update-olcrtc.sh (или вручную в .env).
        OLCRTC_COMMIT: ${OLCRTC_COMMIT:-}
    container_name: xboard-olcrtc-manager
    restart: unless-stopped
    # Пробрасываем наружу только при отладке; в проде Xboard ходит через internal сеть
    # ports:
    #   - "127.0.0.1:8080:8080"
    volumes:
      - olcrmgr-data:/var/lib/olcrtc-manager
      # Если у вас уже есть бинарник olcrtc на хосте — примонтируйте его,
      # чтобы перезаписать тот, что в образе (если сборка не скачала релиз):
      # - /usr/local/bin/olcrtc:/usr/local/bin/olcrtc:ro
    environment:
      - OLCRMGR_LISTEN=0.0.0.0:8080
      - OLCRMGR_API_KEY=${OLCRMGR_API_KEY:-please-change-me-in-env-file}
      - OLCRMGR_DB=/var/lib/olcrtc-manager/instances.db
      - OLCRMGR_BIN=/usr/local/bin/olcrtc
      - OLCRMGR_INSTANCES_DIR=/var/lib/olcrtc-manager/instances
      - OLCRMGR_DEFAULT_PROVIDER=${OLCRMGR_DEFAULT_PROVIDER:-jitsi}
      - OLCRMGR_DEFAULT_TRANSPORT=${OLCRMGR_DEFAULT_TRANSPORT:-datachannel}
      - OLCRMGR_DEFAULT_DNS=${OLCRMGR_DEFAULT_DNS:-8.8.8.8:53}
      - OLCRMGR_DEFAULT_TOKEN=${OLCRMGR_DEFAULT_TOKEN:-}
      # Jitsi Meet сервер для провайдера jitsi (room.id = "<server>/olcrtc-<random>")
      - OLCRMGR_JITSI_SERVER=${OLCRMGR_JITSI_SERVER:-https://meet.ffmuc.net}
    cap_add:
      # olcrtc srv может требовать NET_ADMIN для создания tun-интерфейсов / сокетов
      - NET_ADMIN
      - NET_RAW
    devices:
      # Если на хосте есть /dev/net/tun — передаём в контейнер
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--spider", "--timeout=3", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 8s
    networks:
      - xboard-net

  # ============================================================
  # 3. Redis — кэш + брокер очередей (Laravel cache / queues / horizon / ws)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: xboard-redis
    user: "999:999"
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--save", "300", "10", "--appendonly", "no", "--stop-writes-on-bgsave-error", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - xboard-net

  # ============================================================
  # 4. caddy-tls — опциональный TLS-терминатор (HTTPS :443)
  # ============================================================
  # Нужен, если у вас НЕТ своего внешнего reverse-proxy с сертификатом.
  # Многие платёжные шлюзы (ЮKassa) принимают вебхуки ТОЛЬКО по HTTPS на :443.
  #
  # Включается профилем compose "tls": добавьте в .env строку
  #   COMPOSE_PROFILES=tls
  #   APP_DOMAIN=vless.24x7.hk      # ваш домен (A-запись → этот сервер)
  # и выполните: docker compose up -d caddy-tls
  # (Сертификат Let's Encrypt выпускается автоматически; для писем об
  #  истечении можно указать email в .docker/caddy/Caddyfile.tls)
  #
  # По умолчанию сервис выключен (profiles), поэтому обычные установки за
  # внешним прокси работают как прежде.
  caddy-tls:
    image: caddy:2-alpine
    profiles: ["tls"]
    container_name: xboard-caddy-tls
    restart: unless-stopped
    depends_on:
      - xboard
    ports:
      - "443:443"
      # Порт 80 занят основным контейнером (80:7001), поэтому сертификат
      # выпускается по TLS-ALPN-01 на :443. Если :80 свободен и вы хотите
      # HTTP-01 + редирект http→https — раскомментируйте строку ниже и
      # уберите "80:7001" у сервиса xboard.
      # - "80:80"
    volumes:
      - ./.docker/caddy/Caddyfile.tls:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-vless.24x7.hk}
    networks:
      - xboard-net

volumes:
  redis-data:
  olcrmgr-data:
  caddy-data:
  caddy-config:

networks:
  xboard-net:
    driver: bridge
