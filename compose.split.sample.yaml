# Split deployment for K8s users or operators who want to scale, restart and
# limit each process independently. The single image is reused across services
# by overriding the command and disabling the supervisor programs that are not
# relevant to that role.
#
# Topology:
#   caddy        ──┬─→ web        (HTTP)        :7001 → octane :7001
#                  └─→ ws-server  (WebSocket)   /api/v2/server/ws → :8076
#   horizon      (queue worker, no public port)
#   redis        (state)
#   olcrtc-manager (VPN manager, internal :8080)
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "7001:7001"
    depends_on:
      - web
      - ws-server
    volumes:
      - ./.docker/caddy/Caddyfile.split:/etc/caddy/Caddyfile:ro
    networks:
      - xboard-net

  web:
    image: ghcr.io/vsvavan2/xboard:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      olcrtc-manager:
        condition: service_healthy
    volumes: &shared-volumes
      - ./.env:/www/.env
      - ./.docker/.data/:/www/.docker/.data
      - ./storage/logs:/www/storage/logs
      - ./storage/theme:/www/storage/theme
      - ./plugins:/www/plugins
      - ./plugins-core:/www/plugins-core:ro
    environment: &shared-env
      docker: "true"
      AUTO_INSTALL: "1"                 # Авто-установка при первом старте web-контейнера
      ENABLE_CADDY: "false"
      ENABLE_HORIZON: "false"
      ENABLE_WS_SERVER: "false"
      OLCRMGR_URL: http://olcrtc-manager:8080
      OLCRMGR_API_KEY: ${OLCRMGR_API_KEY:-please-change-me-in-env-file}
    networks:
      - xboard-net

  horizon:
    image: ghcr.io/vsvavan2/xboard:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes: *shared-volumes
    environment:
      <<: *shared-env
      ENABLE_WEB: "false"
      ENABLE_WS_SERVER: "false"
    networks:
      - xboard-net

  ws-server:
    image: ghcr.io/vsvavan2/xboard:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes: *shared-volumes
    environment:
      <<: *shared-env
      ENABLE_WEB: "false"
      ENABLE_HORIZON: "false"
      WS_HOST: "0.0.0.0"
    networks:
      - xboard-net

  olcrtc-manager:
    image: ghcr.io/vsvavan2/xboard-olcrtc-manager:latest
    build:
      context: .
      dockerfile: olcrtc-manager.Dockerfile
      args:
        OLCRTC_RELEASE: ${OLCRTC_RELEASE:-latest}
    container_name: xboard-olcrtc-manager
    restart: unless-stopped
    volumes:
      - olcrmgr-data:/var/lib/olcrtc-manager
    environment:
      - OLCRMGR_LISTEN=0.0.0.0:8080
      - OLCRMGR_API_KEY=${OLCRMGR_API_KEY:-please-change-me-in-env-file}
      - OLCRMGR_DB=/var/lib/olcrtc-manager/instances.db
      - OLCRMGR_BIN=/usr/local/bin/olcrtc
      - OLCRMGR_INSTANCES_DIR=/var/lib/olcrtc-manager/instances
      - OLCRMGR_DEFAULT_PROVIDER=${OLCRMGR_DEFAULT_PROVIDER:-jitsi}
      - OLCRMGR_DEFAULT_TRANSPORT=${OLCRMGR_DEFAULT_TRANSPORT:-datachannel}
      - OLCRMGR_DEFAULT_DNS=${OLCRMGR_DEFAULT_DNS:-8.8.8.8:53}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--spider", "--timeout=3", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 8s
    networks:
      - xboard-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    user: "999:999"
    command: ["redis-server", "--save", "900", "1", "--save", "300", "10", "--save", "60", "10000", "--stop-writes-on-bgsave-error", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - xboard-net

volumes:
  redis-data:
  olcrmgr-data:

networks:
  xboard-net:
    driver: bridge
