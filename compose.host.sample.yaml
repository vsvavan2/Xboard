# Host-networking deployment.
# Use this when Xboard should directly listen on the host network stack
# (no bridge, no published ports).  Common with aaPanel native (openresty
# runs on the host, or you already have nginx/Caddy on the host that
# reverse-proxies to 127.0.0.1:7001).
#
# Ports 7001 (Xboard) and 8080 (olcrtc-manager, localhost only) are opened
# directly on the host.
#
# ======================================================================
# Xboard + OlcRTC Integration — host-networking docker-compose
# ======================================================================

services:
  # ============================================================
  # 1. Xboard — веб + бэкенд + Horizon + WebSocket + Caddy
  # ============================================================
  xboard:
    image: ghcr.io/vsvavan2/xboard:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CACHEBUST: ${CACHEBUST:-1}
    container_name: xboard-web
    restart: unless-stopped
    depends_on:
      - redis
      - olcrtc-manager
    network_mode: host
    volumes:
      - ./.env:/www/.env
      - ./.docker/.data/:/www/.docker/.data
      - ./storage/logs:/www/storage/logs
      - ./storage/theme:/www/storage/theme
      - ./plugins:/www/plugins
      - ./plugins-core:/www/plugins-core:ro
    environment:
      - RESOURCE_PROFILE=balanced        # minimal | balanced | performance | auto
      - ENABLE_HORIZON=true
      - AUTO_INSTALL=1                   # Авто-установка при первом старте
      - docker=true
      # ----- OlcRTC plugin defaults (перебиваются в админке плагина) -----
      - OLCRMGR_URL=http://127.0.0.1:8080
      - OLCRMGR_API_KEY=${OLCRMGR_API_KEY:-please-change-me-in-env-file}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null --max-time 5 http://127.0.0.1:7001/ || ( php -r 'function_exists(\"opcache_reset\") && opcache_reset();' && curl -fsS -o /dev/null --max-time 5 http://127.0.0.1:7002/ )"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 45s

  # ============================================================
  # 2. olcrtc-manager — REST API + супервизор VPN-инстансов
  # ============================================================
  olcrtc-manager:
    image: ghcr.io/vsvavan2/xboard-olcrtc-manager:latest
    build:
      context: .
      dockerfile: olcrtc-manager.Dockerfile
      args:
        OLCRTC_RELEASE: ${OLCRTC_RELEASE:-latest}
    container_name: xboard-olcrtc-manager
    restart: unless-stopped
    network_mode: host
    volumes:
      - olcrmgr-data:/var/lib/olcrtc-manager
      # Если у вас уже есть бинарник olcrtc на хосте — примонтируйте его:
      # - /usr/local/bin/olcrtc:/usr/local/bin/olcrtc:ro
    environment:
      - OLCRMGR_LISTEN=127.0.0.1:8080
      - OLCRMGR_API_KEY=${OLCRMGR_API_KEY:-please-change-me-in-env-file}
      - OLCRMGR_DB=/var/lib/olcrtc-manager/instances.db
      - OLCRMGR_BIN=/usr/local/bin/olcrtc
      - OLCRMGR_INSTANCES_DIR=/var/lib/olcrtc-manager/instances
      - OLCRMGR_DEFAULT_PROVIDER=${OLCRMGR_DEFAULT_PROVIDER:-jitsi}
      - OLCRMGR_DEFAULT_TRANSPORT=${OLCRMGR_DEFAULT_TRANSPORT:-datachannel}
      - OLCRMGR_DEFAULT_DNS=${OLCRMGR_DEFAULT_DNS:-8.8.8.8:53}
      - OLCRMGR_DEFAULT_TOKEN=${OLCRMGR_DEFAULT_TOKEN:-}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--spider", "--timeout=3", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 8s

  # ============================================================
  # 3. Redis — кэш + брокер очередей
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: xboard-redis
    user: "999:999"
    restart: unless-stopped
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--save", "60", "1", "--save", "300", "10", "--appendonly", "no", "--stop-writes-on-bgsave-error", "no", "--port", "6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  redis-data:
  olcrmgr-data:
